# Checks for every pull request (Dependabot's included), per agent-playbook/dependabot.
# No AWS access and no secrets: Dependabot PRs don't get the repo's secrets anyway.

name: Pull Request Checks

on:
  pull_request:

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, unit tests, build
    uses: ./.github/workflows/checks.yaml
