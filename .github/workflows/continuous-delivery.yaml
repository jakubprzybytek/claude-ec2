# Continuous delivery per agent-playbook/continuous-delivery. Deviation (docs/development.md): no dev stage, and the
# tests on int only read, since int controls the one real instance too (the test user's group is read-only).
# From main (every push, or a manual run with main selected): checks -> deploy int -> integration + E2E tests
#   -> tag the next release vM.N -> deploy prod from the tag -> smoke checks without a login.
# From any other branch or tag (manual run, "Use workflow from"): the same, without a new version or tag
# (rollback: pick the release tag).
# Needs the repo secret AWS_ACCOUNT_ID and variable AWS_REGION (aws-github-deploy's setup-role.sh sets both).

name: Continuous Delivery

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
    inputs:
      major:
        description: Bump major version number and release as v(N+1).0
        type: boolean
        default: false

concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yaml

  int:
    name: Deploy int + test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC -> AWS
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the next version

      # From main, releases only go forward: the latest vM.N tag + 1 (v0.147 -> v0.148); the first release is v0.1.
      # The `major` input releases v(M+1).0 instead, also from a commit already released. Otherwise a commit that
      # already has a tag (a re-run) keeps it.
      # From another ref: no new version; the app shows the tag name, or <branch>-<short sha>.
      - id: version
        env:
          MAJOR: ${{ inputs.major || false }}
        run: |
          tags() { git tag "$@" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+$' | head -n1 || true; }
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"; fi
            echo "version=$version" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Deploying $GITHUB_REF as $version, no release"; exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          current=$(tags --points-at HEAD)
          last=$(tags)
          m=${last%%.*}; m=${m#v}; n=${last#*.}
          if [ "$MAJOR" = "true" ]; then
            if [ -n "$current" ] && [ "$current" = "$last" ] && [ "$n" = 0 ]; then version=$current
            else version="v$(( ${m:-0} + 1 )).0"; fi
          elif [ -n "$current" ]; then version=$current
          elif [ -z "$last" ]; then version=v0.1
          else version="v$m.$(( n + 1 ))"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "${last:-none} (HEAD: ${current:-none}) -> $version"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-claude-ec2
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-claude-ec2-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Deploy int
        run: npx sst deploy --stage int
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      # Inside sst shell: the tests get the stage's URLs and the test user (Resource.TestUser, TestUserPassword).
      # Read-only: int controls the real instance (docs/development.md).
      - name: Integration tests
        run: npx sst shell --stage int -- npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npx sst shell --stage int -- npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3

      - name: Tag ${{ steps.version.outputs.version }}
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then echo "$VERSION already tagged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  prod:
    name: Deploy prod
    needs: int
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC -> AWS
    env:
      VERSION: ${{ needs.int.outputs.version }}
    steps:
      # A release deploys from its tag; any other ref from the commit int was tested on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.int.outputs.release == 'true' && format('refs/tags/{0}', needs.int.outputs.version) || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHub-claude-ec2
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-claude-ec2-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Deploy prod
        run: npx sst deploy --stage prod
        env:
          APP_VERSION: ${{ env.VERSION }}

      # No login on prod: the site answers with the app, the API refuses a request without a token.
      - name: Smoke checks
        run: |
          site=$(jq -r .siteUrl .sst/outputs.json)
          for i in 1 2 3 4 5 6; do curl -fsS "$site/" -o index.html && break; sleep 10; done
          grep -q "<title>Claude EC2</title>" index.html
          js=$(grep -o 'assets/index-[^"]*\.js' index.html | head -1)
          curl -fsS "$site/$js" | grep -q "$VERSION" || { echo "the site does not show $VERSION"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$site/api/status")
          [ "$code" = 401 ] || { echo "GET /api/status without a token answered $code, expected 401"; exit 1; }
